services:
  # ─── FastAPI Web Service ──────────────────────────────────────────────
  - type: web
    name: veloq-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: veloq-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: veloq-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: veloq-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: veloq-redis
          property: connectionString

  # ─── Celery Background Worker ─────────────────────────────────────────
  - type: worker
    name: veloq-worker
    runtime: docker
    dockerfilePath: Dockerfile
    dockerCommand: celery -A app.tasks.celery_tasks.celery_app worker --loglevel=info
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: veloq-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: veloq-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: veloq-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: veloq-redis
          property: connectionString

databases:
  - name: veloq-postgres
    databaseName: surveymarket
    user: postgres
    plan: free
